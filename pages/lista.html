<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokémon Elétricos - Lista</title>
    <link rel="stylesheet" href="/styles/style.css">
</head>

<body>
    <main class="pokemon-card">
        <figure class="image-container">
            <img src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/25.png" 
                 alt="Ilustração oficial do Pokémon Pikachu sorrindo">
        </figure>

        <header>
            <h2>Pokémon Elétricos</h2>
            <h2>Lista de Evoluções:</h2>
        </header>
        
       <div class="input-group">
         <label>Nome:</label>
         <input type="text" id="pokemon" placeholder="Digite o nome........">
         <button id="btn-primary">Adicionar</button>
       </div>


        <section class="pokemon-list">
            <ol id="listpokemon">
                <li>Pikachu</li>
                <li>Pichu</li>
                <li>Raichu</li>
            </ol>
        </section>

        <nav class="actions"> 
            <a href="index.html" class="btn-primary">Página Inicial</a>
        </nav>
    </main>
</body>

</html>
