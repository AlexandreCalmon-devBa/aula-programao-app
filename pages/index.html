<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Card Pokémon</title>
    <link rel="stylesheet" href="/styles/style.css">
</head>
<body>

    <div class="pokedex-container">
        <header>
            <h1>Pokédex</h1>
        </header>

        <main class="pokemon-card">
            <div class="image-container">
                <img src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/25.png" alt="Pikachu">
            </div>
            
            <div class="info">
                <span class="number">#025</span>
                <h2 class="name">Pikachu</h2>
                <div class="types">
                    <span class="type electric">Elétrico</span>
                </div>
                <p class="description">
                    Quando vários desses Pokémon se reúnem, sua eletricidade pode causar tempestades de raios.
                </p>
            </div>
        </main>
      <button id="o1">
        <a href="lista.html">Lista</a>
      </button>

    </div>

</body>
</html>
